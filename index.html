<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101510">
  <meta name="description" content="Macumberia — um novo projeto está chegando.">
  <title>Macumberia</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101510;
      color: #f4f4ed;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(ellipse at 50% 0%, #28452e 0%, #101510 58%);
    }
    main { width: min(100%, 720px); text-align: center; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .55rem .85rem;
      border: 1px solid #ffffff25;
      border-radius: 999px;
      color: #d3e6cb;
      font-size: .85rem;
    }
    .dot { width: .5rem; height: .5rem; border-radius: 50%; background: #9cdb76; }
    h1 { margin: 1.5rem 0 1rem; font-size: clamp(3rem, 10vw, 6rem); letter-spacing: -.07em; line-height: 1; }
    p { max-width: 520px; margin: 0 auto; color: #c1c9bd; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
    footer { margin-top: 3rem; color: #879184; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <span class="badge"><span class="dot" aria-hidden="true"></span> Publicado e pronto para evoluir</span>
    <h1>Macumberia</h1>
    <p>Seu site já está no ar. Personalize esta página com as informações, imagens e funcionalidades do seu projeto.</p>
    <footer>© <span id="year"></span> Macumberia</footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
